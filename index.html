<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Nhạc của tôi</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f3f5fb;--sf:#fff;--tx:#161a2b;--mu:#6b7189;--ac:#3b6cf6;--ac2:#e8eeff;--bd:#dde1ee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a2b;--sf:#202640;--tx:#eef0f8;--mu:#9aa1c0;--ac:#7fb0ff;--ac2:#2a3358;--bd:#2d3556;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161a2b;--sf:#202640;--tx:#eef0f8;--mu:#9aa1c0;--ac:#7fb0ff;--ac2:#2a3358;--bd:#2d3556;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
header{padding:14px 16px 8px;display:flex;align-items:center;gap:10px}
h1{font-size:22px;margin:0;flex:1;font-weight:700;letter-spacing:-.3px}
.add{background:var(--ac);color:#fff;border-radius:22px;padding:9px 16px;font-weight:600}
:root[data-theme="dark"] .add,@media (prefers-color-scheme:dark){}
.sr{padding:0 16px 8px}
.sr input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);font:inherit}
#list{flex:1;overflow-y:auto;padding:4px 10px 12px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:8px;border-radius:12px;padding:2px 4px}
.row.on{background:var(--ac2)}
.row .go{flex:1;min-width:0;text-align:left;padding:10px 8px}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.on .t{color:var(--ac)}
.del{color:var(--mu);font-size:20px;width:36px;height:36px}
.empty{text-align:center;color:var(--mu);padding:56px 24px}
.empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:6px}
.empty .add{margin-top:18px}
.empty .add{display:inline-block}
#st{font-size:13px;color:var(--mu);padding:0 16px 6px;min-height:19px}
footer{background:var(--sf);border-top:1px solid var(--bd);padding:12px 16px 14px;border-radius:20px 20px 0 0}
#np{text-align:center;margin-bottom:8px;min-height:44px}
#np .t{font-size:17px}
.bar{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:var(--ac);height:28px}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.ctl svg{width:28px;height:28px;fill:currentColor}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:50%}
.pl{width:68px;height:68px;background:var(--ac);color:#fff}
.pl svg{width:34px;height:34px}
.md{font-size:12px;color:var(--mu);width:76px;text-align:center;line-height:1.2}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<header><h1>Nhạc của tôi</h1><button class="add" id="addB">Thêm nhạc</button></header>
<div class="sr"><input id="q" type="search" placeholder="Tìm bài hát" aria-label="Tìm bài hát"></div>
<div id="st"></div>
<div id="list"></div>
<input id="f" type="file" accept="audio/*,.mp3,.m4a,.flac,.wav,.ogg" multiple hidden>
<footer>
<div id="np"><div class="t" id="nt">Chưa chọn bài</div><div class="a" id="na"></div></div>
<div class="bar"><span id="cur">0:00</span><input id="sk" type="range" min="0" max="1000" value="0" aria-label="Tua"><span id="dur">0:00</span></div>
<div class="ctl">
<button class="md" id="mdB"></button>
<button class="ib" id="pv" aria-label="Bài trước"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9.5 12z"/></svg></button>
<button class="ib pl" id="pp" aria-label="Phát"><svg viewBox="0 0 24 24" id="pi"><path d="M8 5v14l11-7z"/></svg></button>
<button class="ib" id="nx" aria-label="Bài tiếp"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6v12l10.5-6z"/></svg></button>
<span class="md"></span>
</div>
</footer>
<audio id="au" preload="auto"></audio>
<script>
const $=s=>document.querySelector(s),au=$('#au');
const ls={g(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const MODES=[['all','Lặp tất cả'],['one','Lặp một bài'],['shuffle','Ngẫu nhiên'],['once','Phát một lần']];
let db,tracks=[],order=[],pos=-1,curId=null,mode=ls.g('mode','all'),url=null,drag=false,filter='';
const fmt=s=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function open(){return new Promise((res,rej)=>{const r=indexedDB.open('nhac',1);r.onupgradeneeded=()=>r.result.createObjectStore('t',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function tx(m,fn){return new Promise((res,rej)=>{const t=db.transaction('t',m),r=fn(t.objectStore('t'));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error)})}
async function tags(file){
  const out={};try{
    const b=new Uint8Array(await file.slice(0,262144).arrayBuffer());
    if(String.fromCharCode(b[0],b[1],b[2])!=='ID3')return out;
    const v=b[3],sz=((b[6]&127)<<21)|((b[7]&127)<<14)|((b[8]&127)<<7)|(b[9]&127);let p=10;const end=Math.min(10+sz,b.length);
    while(p+10<end){
      const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
      const n=v===4?((b[p+4]&127)<<21)|((b[p+5]&127)<<14)|((b[p+6]&127)<<7)|(b[p+7]&127):(b[p+4]<<24|b[p+5]<<16|b[p+6]<<8|b[p+7]);
      if(id==='TIT2'||id==='TPE1'){
        const e=b[p+10],d=b.slice(p+11,p+10+n),enc=e===1?'utf-16':e===2?'utf-16be':e===3?'utf-8':'windows-1252';
        const s=new TextDecoder(enc).decode(d).replace(/\0/g,'').trim();if(s)out[id==='TIT2'?'title':'artist']=s;
      }
      p+=10+n;
    }
  }catch(e){}return out;
}
async function load(){
  tracks=(await tx('readonly',s=>s.getAll())).sort((a,b)=>a.title.localeCompare(b.title,'vi'));
  buildOrder();render();
}
function buildOrder(){
  order=tracks.map((_,i)=>i);
  if(mode==='shuffle')for(let i=order.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[order[i],order[j]]=[order[j],order[i]]}
  const ci=tracks.findIndex(t=>t.id===curId);pos=ci<0?-1:order.indexOf(ci);
}
function render(){
  const l=$('#list');l.textContent='';
  if(!tracks.length){
    l.innerHTML='<div class="empty"><b>Chưa có bài nào</b>Bấm nút bên dưới và chọn các file nhạc đã tải trong máy. Sau khi thêm, bạn nghe được cả khi không có mạng.<br><button class="add">Thêm nhạc</button></div>';
    l.querySelector('.add').onclick=()=>$('#f').click();return;
  }
  const q=filter.toLowerCase(),fr=document.createDocumentFragment();
  tracks.forEach(t=>{
    if(q&&!(t.title+' '+(t.artist||'')).toLowerCase().includes(q))return;
    const r=document.createElement('div');r.className='row'+(t.id===curId?' on':'');
    const g=document.createElement('button');g.className='go';
    g.innerHTML='<div class="t"></div><div class="a"></div>';
    g.children[0].textContent=t.title;g.children[1].textContent=t.artist||'Không rõ ca sĩ';
    g.onclick=()=>{playId(t.id)};
    const d=document.createElement('button');d.className='del';d.textContent='×';d.setAttribute('aria-label','Xóa '+t.title);
    d.onclick=async()=>{if(!confirm('Xóa "'+t.title+'" khỏi app?'))return;
      if(t.id===curId){au.pause();au.removeAttribute('src');curId=null;ui()}
      await tx('readwrite',s=>s.delete(t.id));load()};
    r.append(g,d);fr.append(r);
  });
  l.append(fr);
}
function setSrc(id){
  const t=tracks.find(x=>x.id===id);if(!t)return false;
  if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(t.blob);au.src=url;curId=id;ls.s('last',id);
  pos=order.indexOf(tracks.indexOf(t));
  $('#nt').textContent=t.title;$('#na').textContent=t.artist||'';
  if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist||''});
  render();return true;
}
function playId(id){if(setSrc(id))au.play().catch(()=>{});}
function step(d,auto){
  if(!tracks.length)return;
  if(auto&&mode==='one'){au.currentTime=0;au.play();return}
  let p=pos+d;
  if(p>=order.length){if(auto&&mode==='once'){au.pause();return}
    if(mode==='shuffle')buildOrder();p=0}
  if(p<0)p=order.length-1;
  playId(tracks[order[p]].id);
}
function ui(){
  $('#pi').innerHTML=au.paused?'<path d="M8 5v14l11-7z"/>':'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
  $('#pp').setAttribute('aria-label',au.paused?'Phát':'Tạm dừng');
  if(!curId){$('#nt').textContent='Chưa chọn bài';$('#na').textContent=''}
}
$('#pp').onclick=()=>{
  if(!curId){if(tracks.length)playId(tracks[order[0]].id);return}
  au.paused?au.play().catch(()=>{}):au.pause();
};
$('#nx').onclick=()=>step(1);$('#pv').onclick=()=>{if(au.currentTime>3)au.currentTime=0;else step(-1)};
au.onended=()=>step(1,true);au.onplay=au.onpause=ui;
au.ontimeupdate=()=>{$('#cur').textContent=fmt(au.currentTime);if(!drag&&au.duration)$('#sk').value=au.currentTime/au.duration*1000};
au.onloadedmetadata=()=>{$('#dur').textContent=fmt(au.duration)};
au.onerror=()=>{if(curId){$('#st').textContent='Không phát được file này, chuyển bài tiếp theo.';setTimeout(()=>{$('#st').textContent='';step(1)},1500)}};
const sk=$('#sk');
sk.oninput=()=>{drag=true;$('#cur').textContent=fmt(sk.value/1000*au.duration)};
sk.onchange=()=>{if(au.duration)au.currentTime=sk.value/1000*au.duration;drag=false};
function mdUI(){$('#mdB').textContent=MODES.find(m=>m[0]===mode)[1]}
$('#mdB').onclick=()=>{mode=MODES[(MODES.findIndex(m=>m[0]===mode)+1)%4][0];ls.s('mode',mode);buildOrder();mdUI()};
$('#q').oninput=e=>{filter=e.target.value;render()};
$('#addB').onclick=()=>$('#f').click();
$('#f').onchange=async e=>{
  const fs=[...e.target.files];let n=0;
  for(const f of fs){
    $('#st').textContent='Đang thêm '+(++n)+'/'+fs.length+': '+f.name;
    const tg=await tags(f);
    try{await tx('readwrite',s=>s.add({title:tg.title||f.name.replace(/\.[^.]+$/,''),artist:tg.artist||'',blob:f}))}
    catch(err){$('#st').textContent='Bộ nhớ đầy hoặc lỗi khi lưu: '+f.name;return}
  }
  e.target.value='';await load();$('#st').textContent='Đã thêm '+fs.length+' bài.';setTimeout(()=>{$('#st').textContent=''},3000);
};
if('mediaSession' in navigator){
  const m=navigator.mediaSession;
  m.setActionHandler('play',()=>au.play());m.setActionHandler('pause',()=>au.pause());
  m.setActionHandler('previoustrack',()=>step(-1));m.setActionHandler('nexttrack',()=>step(1));
  try{m.setActionHandler('seekto',d=>{au.currentTime=d.seekTime})}catch(e){}
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{
  mdUI();
  try{db=await open();await load();
    const last=parseInt(ls.g('last',''),10);
    if(last&&tracks.some(t=>t.id===last))setSrc(last);
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  }catch(e){$('#st').textContent='Trình duyệt không cho lưu nhạc. Hãy thử mở bằng Chrome hoặc Safari.'}
})();
</script>
</body>
</html>
